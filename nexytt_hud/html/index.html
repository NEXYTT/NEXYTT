<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXYTT HUD</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/status.css">
<link rel="stylesheet" href="css/vehicle.css">
<link rel="stylesheet" href="css/notify.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>

<!-- ================= SPRITE DE ICONOS ================= -->

    <symbol id="ic-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></symbol>

<!-- ================= HUD ================= -->
<div id="hud" class="hud is-hidden">

  <!-- Brujula -->
  <section id="compass" class="compass is-hidden">
    <div class="compass__bar">
      <div class="compass__viewport"><div class="compass__track" id="compass-track"></div></div>
      <div class="compass__needle"></div>
      <div class="compass__heading" id="compass-heading">0°</div>
    </div>
    <div class="compass__place">
      <span class="compass__street" id="compass-street"></span>
      <span class="compass__sep" id="compass-sep"></span>
      <span class="compass__zone" id="compass-zone"></span>
    </div>
  </section>

  <!-- Columna derecha: servidor + dinero -->
  <aside class="rail">
    <section id="server" class="panel server is-hidden">
      <header class="server__head">
        <span class="server__logo" id="server-logo">N</span>
        <span class="server__name" id="server-name">NEXYTT RP</span>
      </header>
      <div class="server__chips" id="server-chips"></div>
    </section>

    <section id="money" class="panel money is-hidden">
      <div class="money__row" data-key="cash">
        <svg class="money__icon"><use href="#ic-cash"/></svg>
        <span class="money__value" id="money-cash">0</span>
        <span class="money__delta" id="money-cash-delta"></span>
      </div>
      <div class="money__row" data-key="bank">
        <svg class="money__icon"><use href="#ic-bank"/></svg>
        <span class="money__value" id="money-bank">0</span>
        <span class="money__delta" id="money-bank-delta"></span>
      </div>
      <div class="money__row" data-key="black">
        <svg class="money__icon"><use href="#ic-black"/></svg>
        <span class="money__value" id="money-black">0</span>
        <span class="money__delta" id="money-black-delta"></span>
      </div>
    </section>
  </aside>

  <!-- Notificaciones -->
  <section id="notifications" class="notifications notifications--top-right"></section>

  <!-- Estado del jugador -->
  <section id="status" class="status status--ring">

    <div class="status__ring-wrap">
      <svg class="status__rings" viewBox="0 0 240 240" id="status-rings">
        <defs>
          <mask id="seg-mask-health">
            <path id="mask-health" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="butt"
                  stroke-dasharray="1.35 0.75" pathLength="100"/>
          </mask>
          <mask id="seg-mask-armor">
            <path id="mask-armor" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="butt"
                  stroke-dasharray="1.35 0.75" pathLength="100"/>
          </mask>
        </defs>

        <g mask="url(#seg-mask-health)">
          <path class="arc arc--bg"   id="arc-health-bg"   pathLength="100"/>
          <path class="arc arc--fill" id="arc-health-fill" pathLength="100" data-metric="health"/>
        </g>
        <g mask="url(#seg-mask-armor)">
          <path class="arc arc--bg"   id="arc-armor-bg"   pathLength="100"/>
          <path class="arc arc--fill" id="arc-armor-fill" pathLength="100" data-metric="armor"/>
        </g>
      </svg>

      <div class="status__needs" id="status-needs"></div>

    </div>

    <div class="status__caps">
      <span class="cap cap--health" id="cap-health">
        <svg><use href="#ic-heart"/></svg><b>100</b>
      </span>
      <span class="cap cap--armor is-hidden" id="cap-armor">
        <svg><use href="#ic-shield"/></svg><b>0</b>
      </span>
    </div>

    <div class="status__bars" id="status-bars"></div>

    <div id="voice" class="voice is-hidden">
      <div class="voice__mic"><svg><use href="#ic-mic"/></svg></div>
      <div class="voice__levels"><i></i><i></i><i></i></div>
      <span class="voice__label" id="voice-label">Normal</span>
      <span class="voice__radio is-hidden" id="voice-radio"><svg><use href="#ic-radio"/></svg><b>0</b></span>
    </div>
  </section>

  <!-- Vehiculo -->
  <section id="vehicle" class="vehicle is-hidden">
    <div class="vehicle__side">
      <div class="vbar" id="vbar-fuel" data-metric="fuel">
        <div class="vbar__track"><div class="vbar__fill"></div></div>
        <svg class="vbar__icon"><use href="#ic-fuel"/></svg>
      </div>
      <div class="vbar" id="vbar-engine" data-metric="engine">
        <div class="vbar__track"><div class="vbar__fill"></div></div>
        <svg class="vbar__icon"><use href="#ic-engine"/></svg>
      </div>
    </div>

    <div class="gauge">
      <svg class="gauge__svg" viewBox="0 0 220 220">
        <defs>
          <mask id="seg-mask-gauge">
            <path id="mask-gauge" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="butt"
                  stroke-dasharray="1.1 0.7" pathLength="100"/>
          </mask>
          <mask id="seg-mask-rpm">
            <path id="mask-rpm" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="butt"
                  stroke-dasharray="0.9 0.75" pathLength="100"/>
          </mask>
        </defs>

        <g mask="url(#seg-mask-gauge)">
          <path class="arc arc--bg"    id="arc-speed-bg"   pathLength="100"/>
          <path class="arc arc--speed" id="arc-speed-fill" pathLength="100"/>
        </g>
        <g mask="url(#seg-mask-rpm)">
          <path class="arc arc--bg"  id="arc-rpm-bg"   pathLength="100"/>
          <path class="arc arc--rpm" id="arc-rpm-fill" pathLength="100"/>
        </g>
      </svg>

      <div class="gauge__center">
        <span class="gauge__speed" id="veh-speed">0</span>
        <span class="gauge__units" id="veh-units">km/h</span>
      </div>
      <div class="gauge__gear" id="veh-gear">N</div>

      <div class="gauge__blinker gauge__blinker--left"  id="veh-left"><svg><use href="#ic-left"/></svg></div>
      <div class="gauge__blinker gauge__blinker--right" id="veh-right"><svg><use href="#ic-right"/></svg></div>
    </div>

    <div class="vehicle__pills">
      <span class="pill" id="pill-belt"><svg><use href="#ic-belt"/></svg></span>
      <span class="pill" id="pill-lights"><svg><use href="#ic-light"/></svg></span>
      <span class="pill" id="pill-cruise"><svg><use href="#ic-cruise"/></svg></span>
    </div>
  </section>

  <div class="cinematic" id="cinematic"><i></i><i></i></div>
</div>

<!-- ================= AJUSTES ================= -->
<div id="settings" class="settings is-hidden">
  <div class="settings__backdrop" data-close></div>

  <div class="settings__panel" role="dialog" aria-modal="true" aria-label="Ajustes del HUD">
    <header class="settings__head">
      <div class="settings__title">
        <svg class="settings__title-icon"><use href="#ic-gear"/></svg>
        <div>
          <h1 id="settings-title">Ajustes del HUD</h1>
          <p id="settings-sub">nexytt_hud · v1.0.0</p>
        </div>
      </div>
      <button class="settings__close" data-close aria-label="Cerrar">
        <svg><use href="#ic-x"/></svg>
      </button>
    </header>

    <div class="settings__body">
      <nav class="settings__nav" id="settings-nav"></nav>
      <div class="settings__content" id="settings-content"></div>
    </div>

    <footer class="settings__foot">
      <span class="settings__hint" id="settings-hint"></span>
      <div class="settings__actions">
        <button class="btn btn--ghost" id="btn-reset">Restablecer</button>
        <button class="btn btn--primary" id="btn-save">Guardar</button>
      </div>
    </footer>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/status.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/compass.js"></script>
<script src="js/panels.js"></script>
<script src="js/notify.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
