<!-- ================= HUD ================= -->
<div id="hud" class="hud is-hidden">

  <!-- Brujula -->
  <section id="compass" class="compass is-hidden" data-module="compass">
    <div class="compass__bar">
      <div class="compass__viewport"><div class="compass__track" id="compass-track"></div></div>
      <div class="compass__needle"></div>
      <div class="compass__heading" id="compass-heading">0°</div>
    </div>
    <div class="compass__place">
      <span class="compass__street" id="compass-street"></span>
      <span class="compass__sep" id="compass-sep"></span>
      <span class="compass__zone" id="compass-zone"></span>
    </div>
  </section>

  <!-- Columna derecha: servidor + dinero -->
  <aside class="rail" id="rail" data-module="rail">
    <section id="server" class="panel server is-hidden">
      <header class="server__head">
        <span class="server__logo" id="server-logo">N</span>
        <span class="server__name" id="server-name">NEXYTT RP</span>
      </header>
      <div class="server__chips" id="server-chips"></div>
    </section>

    <section id="money" class="panel money is-hidden">
      <div class="money__row" data-key="cash">
        <svg class="money__icon"><use href="#ic-cash"/></svg>
        <span class="money__value" id="money-cash">0</span>
        <span class="money__delta" id="money-cash-delta"></span>
      </div>
      <div class="money__row" data-key="bank">
        <svg class="money__icon"><use href="#ic-bank"/></svg>
        <span class="money__value" id="money-bank">0</span>
        <span class="money__delta" id="money-bank-delta"></span>
      </div>
      <div class="money__row" data-key="black">
        <svg class="money__icon"><use href="#ic-black"/></svg>
        <span class="money__value" id="money-black">0</span>
        <span class="money__delta" id="money-black-delta"></span>
      </div>
    </section>
  </aside>

  <!-- Notificaciones -->
  <section id="notifications" class="notifications notifications--top-right" data-module="notifications"></section>

  <!-- Estado del jugador (el marcado depende del estilo elegido) -->
  <section id="status" class="status" data-style="ring" data-module="status"></section>

  <!-- Voz -->
  <div id="voice" class="voice is-hidden" data-module="voice">
    <div class="voice__mic"><svg><use href="#ic-mic"/></svg></div>
    <div class="voice__levels"><i></i><i></i><i></i></div>
    <span class="voice__label" id="voice-label">Normal</span>
    <span class="voice__radio is-hidden" id="voice-radio"><svg><use href="#ic-radio"/></svg><b>0</b></span>
  </div>

  <!-- Arma equipada -->
  <div id="weapon" class="weapon is-hidden" data-module="weapon">
    <svg class="weapon__icon"><use href="#ic-weapon"/></svg>
    <span class="weapon__name" id="weapon-name"></span>
    <span class="weapon__ammo"><b id="weapon-clip">0</b><i id="weapon-reserve">/0</i></span>
  </div>

  <!-- Vehiculo (el marcado depende del velocimetro elegido) -->
  <section id="vehicle" class="vehicle is-hidden" data-style="circle" data-module="vehicle"></section>

  <div class="cinematic" id="cinematic"><i></i><i></i></div>
</div>

<!-- ================= MENU CENITAL DEL VEHICULO ================= -->
<div id="vehmenu" class="vehmenu is-hidden">
  <div class="vehmenu__backdrop" data-vehclose></div>
  <div class="vehmenu__panel" role="dialog" aria-modal="true" aria-label="Menu del vehiculo">
    <header class="vehmenu__head">
      <div>
        <h2 id="vehmenu-name">Vehiculo</h2>
        <p><svg><use href="#ic-plate"/></svg><span id="vehmenu-plate">—</span></p>
      </div>
      <button class="vehmenu__close" data-vehclose aria-label="Cerrar"><svg><use href="#ic-x"/></svg></button>
    </header>

    <div class="vehmenu__body">
      <div class="vehmenu__diagram" id="vehmenu-diagram"></div>
      <div class="vehmenu__side">
        <div class="vehmenu__gauges" id="vehmenu-gauges"></div>
        <div class="vehmenu__actions" id="vehmenu-actions"></div>
        <p class="vehmenu__hint" id="vehmenu-hint"></p>
      </div>
    </div>
  </div>
</div>

<!-- ================= EDITOR DE POSICION ================= -->
<div id="editor" class="editor is-hidden">
  <div class="editor__grid"></div>
  <div class="editor__bar">
    <span class="editor__title"><svg><use href="#ic-move"/></svg><b id="editor-title">Mover elementos</b></span>
    <span class="editor__help" id="editor-help"></span>
    <span class="editor__actions">
      <button class="btn btn--ghost" id="editor-reset"><svg><use href="#ic-undo"/></svg>Restablecer</button>
      <button class="btn btn--ghost" id="editor-cancel">Cancelar</button>
      <button class="btn btn--primary" id="editor-save"><svg><use href="#ic-save"/></svg>Guardar</button>
    </span>
  </div>
</div>

<!-- ================= AJUSTES ================= -->
<div id="settings" class="settings is-hidden">
  <div class="settings__backdrop" data-close></div>

  <div class="settings__panel" role="dialog" aria-modal="true" aria-label="Ajustes del HUD">
    <header class="settings__head">
      <div class="settings__title">
        <svg class="settings__title-icon"><use href="#ic-gear"/></svg>
        <div>
          <h1 id="settings-title">Ajustes del HUD</h1>
          <p id="settings-sub">nexytt_hud · v1.0.0</p>
        </div>
      </div>
      <button class="settings__close" data-close aria-label="Cerrar">
        <svg><use href="#ic-x"/></svg>
      </button>
    </header>

    <div class="settings__body">
      <nav class="settings__nav" id="settings-nav"></nav>
      <div class="settings__content" id="settings-content"></div>
    </div>

    <footer class="settings__foot">
      <span class="settings__hint" id="settings-hint"></span>
      <div class="settings__actions">
        <button class="btn btn--ghost" id="btn-reset">Restablecer</button>
        <button class="btn btn--primary" id="btn-save">Guardar</button>
      </div>
    </footer>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/status.js"></script>
<script src="js/vehmenu.js"></script>
<script src="js/editor.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/compass.js"></script>
<script src="js/panels.js"></script>
<script src="js/notify.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
